[package]
name = "zwatch"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "zwatch"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["full"] }
anyhow = "1.0"
async-trait = "0.1"
openssh = "0.11"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
lapin = "3.7" # For RabbitMQ/AMQP support
config = "0.15"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = "0.4"
urlencoding = "2.1"
toml = "0.9"
clap = { version = "4.5.52", features = ["derive"] }
teloxide = { version = "0.17", default-features = false, features = [
    "macros",
    "rustls",
] }
